{% load static %}

<header class="header">

    <div class="container header__top">
        <div class="header__info">
            <span>ПРИЁМ ЗАКАЗОВ</span>
            <span>08:00 — 22:00 • ДОСТАВКА 24/7</span>
        </div>

        <div class="header__contacts">
            <a href="tel:+70000000000" class="btn">ПОЗВОНИТЬ</a>
            <a href="#" class="btn">НАПИСАТЬ В TG</a>
        </div>
    </div>

    <div class="header__divider"></div>

    <div class="container header__main">

        <a href="/" class="logo">
            <img src="{% static 'icons/logo.svg' %}" alt="Flowerna">
        </a>

        <nav class="nav">
            <a href="{% url 'home' %}">ГЛАВНАЯ</a>
            <a href="{% url 'catalog' %}">КАТАЛОГ</a>
            <a href="{% url 'kompanijam' %}">КОМПАНИЯМ</a>
            <a href="{% url 'about' %}">О НАС</a>
        </nav>

        <div class="header__icons">

            <div class="icon-btn" onclick="openSearch()">
                <img src="{% static 'icons/proicons_search.svg' %}" alt="search">
            </div>

            <a href="{% url 'favorites' %}" class="icon-btn">
                <img src="{% static 'icons/si_heart-line.svg' %}" alt="favorites">
            </a>

            <a href="{% url 'cart' %}" class="icon-btn">
                <img src="{% static 'icons/bag.svg' %}">
            </a>

            {% if user.is_authenticated %}
                <a href="{% url 'profile' %}" class="icon-btn" title="Личный кабинет">
                    <img src="{% static 'icons/profile.png' %}" alt="profile">
                </a>

                <form action="{% url 'logout' %}" method="post" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-link"
                            style="background: none; border: none; color: #333; cursor: pointer; padding: 0; margin-left: 8px;">
                        Выйти
                    </button>
                </form>

                <span class="user-name" style="margin-left: 8px; font-size: 14px; color: #666;">
                    {{ user.username }}
                </span>
            {% else %}
                <a href="{% url 'login' %}?next={{ request.path }}" class="icon-btn" title="Войти">
                    <img src="{% static 'icons/profile.png' %}" alt="login">
                </a>
                <a href="{% url 'register' %}" class="btn" style="margin-left: 8px;">Регистрация</a>
            {% endif %}

        </div>

    </div>

    <div id="searchModal" class="search-modal">
        <div class="search-box">
            <form action="{% url 'catalog' %}" method="GET" class="search-form">
                <input type="text" name="q" placeholder="Поиск товаров..." autocomplete="off"
                       value="{{ request.GET.q|default:'' }}">
                <button type="submit" class="search-btn">
                    <img src="{% static 'icons/proicons_search.svg' %}" alt="search">
                </button>
            </form>
            <span class="close" onclick="closeSearch()">✕</span>
        </div>
    </div>
</header>

<style>
    .header__icons {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .icon-btn {
        cursor: pointer;
        transition: opacity 0.3s;
    }

    .icon-btn:hover {
        opacity: 0.7;
    }

    .user-name {
        margin-left: 8px;
        font-size: 14px;
        color: #666;
    }


    .search-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        z-index: 9999;
        justify-content: center;
        align-items: flex-start;
        padding-top: 80px;
    }

    .search-box {
        position: relative;
        width: 90%;
        max-width: 600px;
        background: white;
        border-radius: 50px;
        padding: 5px 15px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .search-form {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
    }

    .search-form input {
        flex: 1;
        padding: 12px 0;
        border: none;
        outline: none;
        font-size: 16px;
        background: transparent;
    }

    .search-btn {
        background: none;
        border: none;
        cursor: pointer;
        padding: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        transition: background 0.3s;
    }

    .search-btn:hover {
        background: #f0f0f0;
    }

    .search-btn img {
        width: 20px;
        height: 20px;
    }

    .close {
        cursor: pointer;
        font-size: 24px;
        padding: 0 5px;
        color: #999;
        transition: color 0.3s;
        line-height: 1;
    }

    .close:hover {
        color: #000;
    }

    button[type="submit"] {
        background: none;
        border: none;
        cursor: pointer;
    }
</style>

<script>
    function openSearch() {
        document.getElementById('searchModal').style.display = 'flex';
        // Автоматически фокусируемся на поле ввода
        setTimeout(function () {
            document.querySelector('#searchModal input').focus();
        }, 100);
    }

    function closeSearch() {
        document.getElementById('searchModal').style.display = 'none';
    }

    // Закрытие по нажатию ESC
    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
            closeSearch();
        }
    });

    // Закрытие по клику вне окна
    document.getElementById('searchModal').addEventListener('click', function (event) {
        if (event.target === this) {
            closeSearch();
        }
    });
</script>
