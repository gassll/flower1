{% load static %}


<header class="header">
    <div class="container header__top">
        <div class="header__info">
            <span>ПРИЁМ ЗАКАЗОВ</span>
            <span>08:00 — 22:00 • ДОСТАВКА 24/7</span>
        </div>

        <div class="header__contacts">
            <a href="tel:+70000000000" class="btn">ПОЗВОНИТЬ</a>
            <a href="#" class="btn">НАПИСАТЬ В TG</a>
        </div>
    </div>

    <div class="header__divider"></div>

    <div class="container header__main">
        <a href="/" class="logo">
            <img src="{% static 'icons/logo.svg' %}" alt="Flowerna">
        </a>

        <nav class="nav" id="desktopNav">
            <a href="{% url 'home' %}">ГЛАВНАЯ</a>
            <a href="{% url 'catalog' %}">КАТАЛОГ</a>
            <a href="{% url 'kompanijam' %}">КОМПАНИЯМ</a>
            <a href="{% url 'about' %}">О НАС</a>
        </nav>

        <div class="header__right">
            <div class="header__icons">
                <div class="icon-btn" onclick="openSearch()">
                    <img src="{% static 'icons/proicons_search.svg' %}" alt="search">
                </div>

                <a href="{% url 'favorites' %}" class="icon-btn">
                    <img src="{% static 'icons/si_heart-line.svg' %}" alt="favorites">
                </a>

                <a href="{% url 'cart' %}" class="icon-btn">
                    <img src="{% static 'icons/bag.svg' %}" alt="cart">
                </a>

                {% if user.is_authenticated %}
                    <a href="{% url 'profile' %}" class="icon-btn" title="Личный кабинет">
                        <img src="{% static 'icons/profile.png' %}" alt="profile">
                    </a>

                    <form action="{% url 'logout' %}" method="post" style="display: inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn-logout">Выйти</button>
                    </form>

                    <span class="user-name">{{ user.username }}</span>
                {% else %}
                    <a href="{% url 'login' %}?next={{ request.path }}" class="icon-btn" title="Войти">
                        <img src="{% static 'icons/profile.png' %}" alt="login">
                    </a>
                    <a href="{% url 'register' %}" class="btn register-btn">Регистрация</a>
                {% endif %}
            </div>

            <button type="button" class="burger-btn" id="burgerBtn" aria-label="Открыть меню">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </div>

    <div class="mobile-menu" id="mobileMenu">
        <a href="{% url 'home' %}">ГЛАВНАЯ</a>
        <a href="{% url 'catalog' %}">КАТАЛОГ</a>
        <a href="{% url 'kompanijam' %}">КОМПАНИЯМ</a>
        <a href="{% url 'about' %}">О НАС</a>
    </div>

    <div id="searchModal" class="search-modal">
        <div class="search-box">
            <form action="{% url 'catalog' %}" method="GET" class="search-form">
                <input type="text" name="q" placeholder="Поиск товаров..." autocomplete="off"
                       value="{{ request.GET.q|default:'' }}">
                <button type="submit" class="search-btn">
                    <img src="{% static 'icons/proicons_search.svg' %}" alt="search">
                </button>
            </form>
            <span class="close" onclick="closeSearch()">✕</span>
        </div>
    </div>
</header>

<script>
    function openSearch() {
        document.getElementById('searchModal').style.display = 'flex';
        setTimeout(function () {
            const input = document.querySelector('#searchModal input');
            if (input) input.focus();
        }, 100);
    }

    function closeSearch() {
        document.getElementById('searchModal').style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', function () {
        const burgerBtn = document.getElementById('burgerBtn');
        const mobileMenu = document.getElementById('mobileMenu');

        if (burgerBtn && mobileMenu) {
            burgerBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                mobileMenu.classList.toggle('active');
            });

            document.addEventListener('click', function (e) {
                if (!burgerBtn.contains(e.target) && !mobileMenu.contains(e.target)) {
                    mobileMenu.classList.remove('active');
                }
            });
        }

        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                closeSearch();
                if (mobileMenu) mobileMenu.classList.remove('active');
            }
        });

        const searchModal = document.getElementById('searchModal');
        if (searchModal) {
            searchModal.addEventListener('click', function (event) {
                if (event.target === this) {
                    closeSearch();
                }
            });
        }
    });
</script>
