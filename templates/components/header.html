{% load static %}

<header class="header">
    <div class="container header__top">
        <div class="header__info">
            <span>ПРИЁМ ЗАКАЗОВ</span>
            <span>08:00 — 22:00 • ДОСТАВКА 24/7</span>
        </div>

        <div class="header__contacts">
            <a href="tel:+70000000000" class="btn">ПОЗВОНИТЬ</a>
            <a href="#" class="btn">НАПИСАТЬ В TG</a>
        </div>
    </div>

    <div class="header__divider"></div>

    <div class="container header__main">
        <a href="/" class="logo">
            <img src="{% static 'icons/logo.svg' %}" alt="Flowerna">
        </a>

        <nav class="nav" id="desktopNav">
            <a href="{% url 'home' %}">ГЛАВНАЯ</a>
            <a href="{% url 'catalog' %}">КАТАЛОГ</a>
            <a href="{% url 'kompanijam' %}">КОМПАНИЯМ</a>
            <a href="{% url 'about' %}">О НАС</a>
        </nav>

        <div class="header__right">
            <div class="header__icons">
                <div class="icon-btn" onclick="openSearch()">
                    <img src="{% static 'icons/proicons_search.svg' %}" alt="search">
                </div>

                <a href="{% url 'favorites' %}" class="icon-btn">
                    <img src="{% static 'icons/si_heart-line.svg' %}" alt="favorites">
                </a>

                <a href="{% url 'cart' %}" class="icon-btn">
                    <img src="{% static 'icons/bag.svg' %}" alt="cart">
                </a>

                {% if user.is_authenticated %}
                    <a href="{% url 'profile' %}" class="icon-btn" title="Личный кабинет">
                        <img src="{% static 'icons/profile.png' %}" alt="profile">
                    </a>

                    <form action="{% url 'logout' %}" method="post" style="display: inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-link logout-btn">Выйти</button>
                    </form>

                    <span class="user-name">{{ user.username }}</span>
                {% else %}
                    <a href="{% url 'login' %}?next={{ request.path }}" class="icon-btn" title="Войти">
                        <img src="{% static 'icons/profile.png' %}" alt="login">
                    </a>
                    <a href="{% url 'register' %}" class="btn register-btn">Регистрация</a>
                {% endif %}
            </div>

            <button type="button" class="burger-btn" id="burgerBtn" aria-label="Открыть меню">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </div>

    <div class="mobile-menu" id="mobileMenu">
        <a href="{% url 'home' %}">ГЛАВНАЯ</a>
        <a href="{% url 'catalog' %}">КАТАЛОГ</a>
        <a href="{% url 'kompanijam' %}">КОМПАНИЯМ</a>
        <a href="{% url 'about' %}">О НАС</a>
    </div>

    <div id="searchModal" class="search-modal">
        <div class="search-box">
            <form action="{% url 'catalog' %}" method="GET" class="search-form">
                <input type="text" name="q" placeholder="Поиск товаров..." autocomplete="off"
                       value="{{ request.GET.q|default:'' }}">
                <button type="submit" class="search-btn">
                    <img src="{% static 'icons/proicons_search.svg' %}" alt="search">
                </button>
            </form>
            <span class="close" onclick="closeSearch()">✕</span>
        </div>
    </div>
</header>

<style>




    .header__info {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
    }



    .header__divider {
        height: 1px;
        background: rgba(0, 0, 0, 0.15);
    }

    .header__main {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 16px 0;
        position: relative;
    }

    .logo {
        flex-shrink: 0;
    }

    .logo img {
        height: 40px;
        width: auto;
        display: block;
    }



    .header__right {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
    }

    .header__icons {
        display: flex;
        align-items: center;
        gap: 15px;
        flex-wrap: wrap;
        justify-content: flex-end;
    }

    .icon-btn {
        cursor: pointer;
        transition: opacity 0.3s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .icon-btn:hover {
        opacity: 0.7;
    }

    .icon-btn img {
        display: block;
        width: 22px;
        height: 22px;
    }

    .user-name {
        font-size: 14px;
        color: #666;
        white-space: nowrap;
    }

    .logout-btn,
    .register-btn {
        text-decoration: none;
        white-space: nowrap;
    }

    .burger-btn {
        display: none;
        width: 40px;
        height: 40px;
        background: transparent;
        border: none;
        padding: 9px;
        cursor: pointer;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
    }

    .burger-btn span {
        display: block;
        width: 100%;
        height: 2px;
        background: #000;
        border-radius: 2px;
    }

    .mobile-menu {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background: #fff;
        border-top: 1px solid #ddd;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        z-index: 1000;
        flex-direction: column;
        padding: 8px 0;
    }

    .mobile-menu a {
        padding: 12px 20px;
        color: #111;
        text-decoration: none;
        font-size: 14px;
        letter-spacing: 1px;
    }

    .mobile-menu a:hover {
        background: #f5f5f5;
    }

    .mobile-menu.active {
        display: flex;
    }

    .search-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        z-index: 9999;
        justify-content: center;
        align-items: flex-start;
        padding-top: 80px;
    }

    .search-box {
        position: relative;
        width: 90%;
        max-width: 600px;
        background: white;
        border-radius: 50px;
        padding: 5px 15px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .search-form {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
    }

    .search-form input {
        flex: 1;
        padding: 12px 0;
        border: none;
        outline: none;
        font-size: 16px;
        background: transparent;
    }

    .search-btn {
        background: none;
        border: none;
        cursor: pointer;
        padding: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        transition: background 0.3s;
    }

    .search-btn:hover {
        background: #f0f0f0;
    }

    .search-btn img {
        width: 20px;
        height: 20px;
    }

    .close {
        cursor: pointer;
        font-size: 24px;
        padding: 0 5px;
        color: #999;
        transition: color 0.3s;
        line-height: 1;
    }

    .close:hover {
        color: #000;
    }

    /* Медиа-запросы для мобильной версии */
    @media (max-width: 768px) {
        .header__top {
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-align: center;
        }

        .header__info {
            justify-content: center;
        }

        .nav {
            display: none;
        }

        .burger-btn {
            display: flex;
        }

        .header__right {
            gap: 8px;
        }

        .user-name {
            display: none;
        }

        .register-btn {
            display: none;
        }
    }

    /* Для очень маленьких экранов */
    @media (max-width: 480px) {
        .header__top {
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .header__info {
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .header__contacts {
            justify-content: center;
        }
    }
</style>

<script>
    function openSearch() {
        document.getElementById('searchModal').style.display = 'flex';
        setTimeout(function () {
            const input = document.querySelector('#searchModal input');
            if (input) input.focus();
        }, 100);
    }

    function closeSearch() {
        document.getElementById('searchModal').style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', function () {
        const burgerBtn = document.getElementById('burgerBtn');
        const mobileMenu = document.getElementById('mobileMenu');

        if (burgerBtn && mobileMenu) {
            burgerBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                mobileMenu.classList.toggle('active');
            });

            document.addEventListener('click', function (e) {
                if (!burgerBtn.contains(e.target) && !mobileMenu.contains(e.target)) {
                    mobileMenu.classList.remove('active');
                }
            });
        }

        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                closeSearch();
                if (mobileMenu) mobileMenu.classList.remove('active');
            }
        });

        const searchModal = document.getElementById('searchModal');
        if (searchModal) {
            searchModal.addEventListener('click', function (event) {
                if (event.target === this) {
                    closeSearch();
                }
            });
        }
    });
</script>
