{% extends 'base.html' %}
{% load static %}

{% block content %}

<section class="product-delete py-5">

    <div class="container">

        <!-- НАЗАД -->
        <a href="{% url 'catalog' %}" class="back-btn">
            ← Назад
        </a>

        <div class="row mt-4">

            <div class="col-lg-6 mx-auto">

                <div class="card p-4 shadow-sm text-center">

                    <h1 class="mb-3">
                        Удаление товара
                    </h1>

                    <p class="mb-4">
                        Вы действительно хотите удалить товар:
                    </p>

                    <h4 class="mb-4">
                        {{ product.name }}
                    </h4>

                    {% if product.image %}
                        <img src="{{ product.image.url }}"
                             alt="{{ product.name }}"
                             class="img-fluid rounded mb-4"
                             style="max-height: 250px; object-fit: cover;">
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}

                        <div class="d-flex justify-content-center gap-2">

                            <button type="submit" class="btn btn-danger">
                                Да, удалить
                            </button>

                            <a href="{% url 'catalog' %}" class="btn btn-outline-secondary">
                                Отмена
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
