<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>{% block title %}FlowerShop{% endblock %}</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }


        .hero-cards {
        max-width: 100%;
        margin: 20px 0 0 20px;
    }

    .hero-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: flex-start;
    }

    .hero-card {
        position: relative;
        display: block;
        width: calc((100% - 32px) / 3);
        height: 280px;
        overflow: hidden;
        text-decoration: none;
        color: #fff;
        border-radius: 4px;
        background: #ddd;
        flex: 0 0 calc((100% - 32px) / 3);
    }

    .hero-card__img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scale(1);
        transition: transform 0.3s ease;
    }

    .hero-card:hover .hero-card__img {
        transform: scale(1.05);
    }

    .hero-card__img--empty {
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #c9b29b, #8f6f52);
    }

    .hero-card__overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
            to top,
            rgba(0, 0, 0, 0.55) 0%,
            rgba(0, 0, 0, 0.15) 50%,
            rgba(0, 0, 0, 0.05) 100%
        );
    }

    .hero-card__content {
        position: absolute;
        left: 14px;
        bottom: 14px;
        right: 38px;
        z-index: 2;
    }

    .hero-card__title {
        margin: 0 0 6px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        line-height: 1;
    }

    .hero-card__text {
        margin: 0;
        font-size: 12px;
        line-height: 1.2;
        text-transform: uppercase;
        max-width: 85%;
    }

    .hero-card__arrow {
        position: absolute;
        right: 12px;
        top: 10px;
        z-index: 2;
        font-size: 34px;
        line-height: 1;
        color: #fff;
        font-weight: 300;
    }

    @media (max-width: 1024px) {
        .hero-card {
            width: calc((100% - 16px) / 2);
            flex-basis: calc((100% - 16px) / 2);
        }
    }

    @media (max-width: 768px) {
        .hero-card {
            width: 100%;
            flex-basis: 100%;
            height: 240px;
        }

        .hero-cards {
            margin-left: 12px;
            margin-right: 12px;
        }

        .hero-card__title {
            font-size: 18px;
        }

        .hero-card__text {
            font-size: 11px;
        }

        .hero-card__arrow {
            font-size: 28px;
        }
    }
    </style>
</head>
<body>
<!-- Шапка -->
<header class="bg-light shadow-sm">
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="{% url 'categories' %}">
                <i class="bi bi-flower1"></i> FlowerShop
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'categories' %}">
                            <i class="bi bi-house"></i> Главная
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-cart2"></i> Корзина
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-heart"></i> Избранное
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-person"></i> Войти
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<!-- Основной контент -->
<main class="container my-4">
    {% block content %}
    {% endblock %}
</main>

<!-- Подвал -->
{% include 'components/footer.html' %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
