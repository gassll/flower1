{% load static %}

<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>{% block title %}{% endblock %}</title>

</head>

<body>

{% block content %}
<div class="container">

    <header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">

        <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
            <li><a href="{% url 'catalog:main' %}" class="nav-link px-2 link-dark">Главная</a></li>
            <li><a href="{% url 'catalog:category_list' %}" class="nav-link px-2 link-dark">Категории</a></li>
            <li><a href="{% url 'catalog:products_list' %}" class="nav-link px-2 link-dark">Товары</a></li>
            <li><a href="#" class="nav-link px-2 link-dark">О нас</a></li>
        </ul>

        <div class="col-md-3 text-end">
            <button type="button" class="btn btn-outline-primary me-2">
                <ya-tr-span data-index="3-0" data-translated="true" data-source-lang="en" data-target-lang="ru"
                            data-value="Login" data-translation="Войти" data-ch="0" data-type="trSpan"
                            style="visibility: inherit !important;">Войти
                </ya-tr-span>
            </button>
            <button type="button" class="btn btn-primary">
                <ya-tr-span data-index="3-0" data-translated="true" data-source-lang="en" data-target-lang="ru"
                            data-value="Sign-up" data-translation="Зарегистрироваться" data-ch="0" data-type="trSpan"
                            style="visibility: inherit !important;">Зарегистрироваться
                </ya-tr-span>
            </button>
        </div>
    </header>
</div>
{% endblock %}
</body>
</html>
